# Vehicle Debugging Assistant — GitLab CI (runner-optimized)
# Goals: short wall-clock, small artifacts, high cache hit rate, DAG via needs.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - build
  - test
  - validate
  - package
  - release

variables:
  GIT_DEPTH: "20"
  GIT_STRATEGY: fetch
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  npm_config_prefer_offline: "true"
  npm_config_audit: "false"
  npm_config_fund: "false"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  interruptible: true
  timeout: 12m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure

.compile_cache: &npm_cache
  key:
    files:
      - package-lock.json
      - package.json
    prefix: npm-v1
  paths:
    - .npm/
    - node_modules/
  policy: pull-push

compile:
  stage: build
  image: node:${NODE_VERSION}-bookworm-slim
  cache:
    <<: *npm_cache
  before_script:
    - node -v && npm -v
  script:
    - npm ci --prefer-offline --no-audit --no-fund || npm install --no-audit --no-fund
    - npm run compile
    - test -d out && test -f out/extension.js
  artifacts:
    name: "out-$CI_COMMIT_SHORT_SHA"
    paths:
      - out/
    expire_in: 12 hours
    when: on_success

.test_python_cache: &pip_cache
  key:
    files:
      - tests/
      - pytest.ini
    prefix: pip-pytest-v1
  paths:
    - .cache/pip/
  policy: pull-push

test:python:junit:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  needs: []
  cache:
    <<: *pip_cache
  before_script:
    - pip install --quiet --cache-dir="$PIP_CACHE_DIR" pytest
  script:
    - python -m py_compile src/python/*.py
    - python -m pytest tests/ -q --tb=line --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - junit.xml
    expire_in: 14 days
  timeout: 8m

lint:ts:
  stage: test
  image: node:${NODE_VERSION}-bookworm-slim
  needs:
    - job: compile
      artifacts: false
  allow_failure: true
  cache:
    key:
      files:
        - package-lock.json
        - package.json
      prefix: npm-v1
    paths:
      - .npm/
      - node_modules/
    policy: pull
  script:
    - npm ci --prefer-offline --no-audit --no-fund || npm install --no-audit --no-fund
    - npm run lint --if-present
  timeout: 8m

validate:cicd-report:
  stage: validate
  image: python:${PYTHON_VERSION}-slim
  needs: []
  script:
    - python scripts/validate_cicd_report.py resources/sample_cicd_report.json
  timeout: 3m

validate:sdlc-docs:
  stage: validate
  image: alpine:3.20
  needs: []
  script:
    - |
      set -e
      for f in \
        docs/PLANNING.md docs/REQUIREMENTS.md docs/TRACEABILITY.md \
        docs/TEST_PLAN.md docs/MAINTENANCE.md docs/CICD.md \
        CHANGELOG.md LICENSE .gitlab-ci.yml
      do
        test -f "$f" || { echo "Missing $f"; exit 1; }
      done
      echo "SDLC docs OK"
  timeout: 2m

package:vsix:
  stage: package
  image: node:${NODE_VERSION}-bookworm-slim
  needs:
    - job: compile
      artifacts: true
    - job: test:python:junit
      artifacts: false
    - job: validate:cicd-report
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  cache:
    key:
      files:
        - package-lock.json
        - package.json
      prefix: npm-v1
    paths:
      - .npm/
      - node_modules/
    policy: pull
  script:
    - npm ci --prefer-offline --no-audit --no-fund || npm install --no-audit --no-fund
    - test -f out/extension.js || npm run compile
    - npx --yes @vscode/vsce@2.22.0 package --no-dependencies -o "vehicle-debugging-assistant-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}.vsix"
    - |
      V="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      V="${V#v}"
      SRC=$(ls vehicle-debugging-assistant-*.vsix | head -n1)
      cp "$SRC" "vehicle-debugging-assistant-${V}-linux.vsix"
      cp "$SRC" "vehicle-debugging-assistant-${V}-windows.vsix"
      ls -lh ./*.vsix
  artifacts:
    name: "vsix-$CI_COMMIT_SHORT_SHA"
    paths:
      - "*.vsix"
    expire_in: 30 days
  timeout: 15m

emit:vda-report-template:
  stage: package
  image: python:${PYTHON_VERSION}-slim
  needs:
    - job: validate:cicd-report
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  script:
    - mkdir -p out
    - |
      python - <<'PY'
      import json, os, datetime
      report = {
        "meta": {
          "pipeline": os.environ.get("CI_PIPELINE_ID", "local"),
          "build": os.environ.get("CI_JOB_ID", "0"),
          "commit": (os.environ.get("CI_COMMIT_SHA") or "unknown")[:12],
          "generatedAt": datetime.datetime.utcnow().isoformat() + "Z",
          "tool": "gitlab-ci-vda",
          "ref": os.environ.get("CI_COMMIT_REF_NAME", ""),
        },
        "errors": [],
        "dtcs": [],
      }
      path = "out/vda-cicd-report.json"
      with open(path, "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)
      print("Wrote", path)
      PY
    - python scripts/validate_cicd_report.py out/vda-cicd-report.json
  artifacts:
    name: "vda-report-$CI_COMMIT_SHORT_SHA"
    paths:
      - out/vda-cicd-report.json
    expire_in: 30 days
  timeout: 3m

release:vsix:
  stage: release
  image: alpine:3.20
  needs:
    - job: package:vsix
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Release artifacts for $CI_COMMIT_TAG"
    - ls -lh ./*.vsix
  artifacts:
    name: "release-$CI_COMMIT_TAG"
    paths:
      - "*.vsix"
    expire_in: 90 days
  timeout: 5m
